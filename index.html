<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Sky Jumper</title>
<style>
  :root { --bg: #0f1530; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); overflow: hidden; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  canvas {
    display: block; border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
    image-rendering: auto;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(() => {
  // ---------- Setup ----------
  const W = 400, H = 640;              // logical resolution
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  function resize() {
    const scale = Math.min(window.innerWidth / W, window.innerHeight / H) * 0.96;
    const dpr = window.devicePixelRatio || 1;
    canvas.style.width = W * scale + 'px';
    canvas.style.height = H * scale + 'px';
    canvas.width = W * scale * dpr;
    canvas.height = H * scale * dpr;
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Constants ----------
  const GRAVITY = 0.38;
  const JUMP_V = -11.5;
  const SPRING_V = -19;
  const MOVE_ACCEL = 0.9;
  const MAX_VX = 7;
  const FRICTION = 0.86;
  const PLAT_W = 70, PLAT_H = 14;

  // ---------- State ----------
  let state = 'menu';   // menu | playing | over
  let player, platforms, particles, stars, score, best, heightClimbed, shake;
  try { best = +localStorage.getItem('skyJumperBest') || 0; } catch { best = 0; }

  // background stars (parallax decoration)
  const bgStars = Array.from({ length: 70 }, () => ({
    x: Math.random() * W, y: Math.random() * H,
    r: Math.random() * 1.6 + 0.3, depth: Math.random() * 0.5 + 0.1
  }));

  function reset() {
    player = { x: W / 2 - 20, y: H - 150, w: 40, h: 40, vx: 0, vy: JUMP_V, face: 1, squash: 0 };
    platforms = [];
    particles = [];
    stars = [];
    score = 0;
    heightClimbed = 0;
    shake = 0;
    // guaranteed starting platform under the player
    platforms.push(makePlatform(W / 2 - PLAT_W / 2, H - 60, 'normal'));
    let y = H - 60;
    while (y > -H) {
      y -= gapFor(0);
      platforms.push(randomPlatform(y));
    }
  }

  // difficulty grows with score
  function gapFor(s) {
    const min = 55 + Math.min(s / 120, 45);
    const max = 85 + Math.min(s / 80, 55);
    return min + Math.random() * (max - min);
  }

  function makePlatform(x, y, type) {
    return {
      x, y, w: PLAT_W, h: PLAT_H, type,
      vx: type === 'moving' ? (Math.random() < 0.5 ? -1 : 1) * (1.2 + Math.min(score / 2000, 2.5)) : 0,
      broken: false, fall: 0,
      spring: null
    };
  }

  function randomPlatform(y) {
    const d = Math.min(score / 3000, 1); // 0..1 difficulty
    const r = Math.random();
    let type = 'normal';
    if (r < 0.12 + d * 0.2) type = 'moving';
    else if (r < 0.2 + d * 0.3) type = 'breaking';
    const p = makePlatform(Math.random() * (W - PLAT_W), y, type);
    if (type !== 'breaking' && Math.random() < 0.08) {
      p.spring = { ox: 10 + Math.random() * (PLAT_W - 30), compressed: 0 };
    }
    if (Math.random() < 0.12) {
      stars.push({ x: p.x + PLAT_W / 2, y: y - 45 - Math.random() * 30, t: Math.random() * 6, taken: false });
    }
    // breaking platforms are traps, so make sure there's always a real one nearby
    if (type === 'breaking') {
      const safe = makePlatform(Math.random() * (W - PLAT_W), y - 20 - Math.random() * 20, 'normal');
      return [p, safe];
    }
    return p;
  }

  function addPlatforms() {
    let top = Math.min(...platforms.map(p => p.y));
    while (top > -100) {
      top -= gapFor(score);
      const p = randomPlatform(top);
      if (Array.isArray(p)) platforms.push(...p); else platforms.push(p);
    }
  }

  function burst(x, y, color, n = 10, spread = 3) {
    for (let i = 0; i < n; i++) {
      particles.push({
        x, y,
        vx: (Math.random() - 0.5) * spread * 2,
        vy: (Math.random() - 0.8) * spread,
        life: 30 + Math.random() * 20, max: 50, color,
        r: 2 + Math.random() * 2.5
      });
    }
  }

  // ---------- Input ----------
  const keys = {};
  let touchDir = 0;

  window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (['Space', 'Enter'].includes(e.code)) {
      e.preventDefault();
      if (state !== 'playing') start();
    }
    if (e.code === 'KeyP' || e.code === 'Escape') {
      if (state === 'playing') state = 'paused';
      else if (state === 'paused') state = 'playing';
    }
    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.code)) e.preventDefault();
  });
  window.addEventListener('keyup', e => { keys[e.code] = false; });

  function pointerX(e) {
    const rect = canvas.getBoundingClientRect();
    return (e.clientX - rect.left) / rect.width * W;
  }
  canvas.addEventListener('pointerdown', e => {
    if (state !== 'playing') { start(); return; }
    touchDir = pointerX(e) < W / 2 ? -1 : 1;
  });
  canvas.addEventListener('pointermove', e => {
    if (touchDir !== 0 && e.buttons) touchDir = pointerX(e) < W / 2 ? -1 : 1;
  });
  window.addEventListener('pointerup', () => { touchDir = 0; });
  window.addEventListener('pointercancel', () => { touchDir = 0; });

  function start() {
    reset();
    state = 'playing';
  }

  // ---------- Update ----------
  function update() {
    if (state !== 'playing') {
      // gentle idle bounce on menu
      return;
    }

    const left = keys.ArrowLeft || keys.KeyA || touchDir < 0;
    const right = keys.ArrowRight || keys.KeyD || touchDir > 0;
    if (left) { player.vx -= MOVE_ACCEL; player.face = -1; }
    if (right) { player.vx += MOVE_ACCEL; player.face = 1; }
    if (!left && !right) player.vx *= FRICTION;
    player.vx = Math.max(-MAX_VX, Math.min(MAX_VX, player.vx));

    player.vy += GRAVITY;
    player.x += player.vx;
    player.y += player.vy;
    player.squash *= 0.85;

    // horizontal wrap
    if (player.x + player.w / 2 < 0) player.x += W;
    if (player.x + player.w / 2 > W) player.x -= W;

    // platform collisions (only while falling)
    if (player.vy > 0) {
      const feet = player.y + player.h;
      const prevFeet = feet - player.vy;
      for (const p of platforms) {
        if (p.broken) continue;
        const overlapX = player.x + player.w - 8 > p.x && player.x + 8 < p.x + p.w;
        if (!overlapX || prevFeet > p.y + 2 || feet < p.y) continue;

        // spring?
        if (p.spring) {
          const sx = p.x + p.spring.ox;
          if (player.x + player.w - 6 > sx && player.x + 6 < sx + 20) {
            player.y = p.y - player.h;
            player.vy = SPRING_V;
            p.spring.compressed = 1;
            player.squash = 1;
            burst(sx + 10, p.y, '#ffd84a', 14, 4);
            break;
          }
        }

        if (p.type === 'breaking') {
          p.broken = true;
          burst(p.x + p.w / 2, p.y + 6, '#b07a4a', 14, 3);
          continue; // fall through it
        }

        player.y = p.y - player.h;
        player.vy = JUMP_V;
        player.squash = 1;
        burst(player.x + player.w / 2, p.y, 'rgba(255,255,255,.8)', 6, 1.6);
        break;
      }
    }

    // move platforms
    for (const p of platforms) {
      if (p.type === 'moving') {
        p.x += p.vx;
        if (p.x < 0 || p.x + p.w > W) { p.vx *= -1; p.x = Math.max(0, Math.min(W - p.w, p.x)); }
      }
      if (p.broken) { p.fall += 0.5; p.y += p.fall; }
      if (p.spring) p.spring.compressed *= 0.85;
    }

    // stars pickup
    for (const s of stars) {
      s.t += 0.08;
      if (s.taken) continue;
      const dx = (player.x + player.w / 2) - s.x;
      const dy = (player.y + player.h / 2) - s.y;
      if (dx * dx + dy * dy < 30 * 30) {
        s.taken = true;
        score += 250;
        burst(s.x, s.y, '#ffe46b', 18, 4);
      }
    }

    // camera scroll
    const line = H * 0.4;
    if (player.y < line) {
      const dy = line - player.y;
      player.y = line;
      heightClimbed += dy;
      score += dy * 0.5;
      for (const p of platforms) p.y += dy;
      for (const s of stars) s.y += dy;
      for (const pt of particles) pt.y += dy;
      for (const b of bgStars) {
        b.y += dy * b.depth;
        if (b.y > H) { b.y -= H; b.x = Math.random() * W; }
      }
    }

    // cleanup & spawn
    platforms = platforms.filter(p => p.y < H + 60);
    stars = stars.filter(s => s.y < H + 40 && !(s.taken && s.y > H));
    addPlatforms();

    // particles
    for (const pt of particles) {
      pt.vy += 0.15; pt.x += pt.vx; pt.y += pt.vy; pt.life--;
    }
    particles = particles.filter(pt => pt.life > 0);

    // game over
    if (player.y > H + 20) {
      state = 'over';
      shake = 14;
      score = Math.floor(score);
      if (score > best) {
        best = score;
        try { localStorage.setItem('skyJumperBest', best); } catch {}
      }
    }
  }

  // ---------- Drawing ----------
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawBackground() {
    // sky shifts from dusk to deep space as you climb
    const t = Math.min(heightClimbed / 30000, 1);
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, lerpColor([40, 60, 140], [8, 8, 30], t));
    g.addColorStop(1, lerpColor([120, 170, 230], [40, 30, 90], t));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    for (const b of bgStars) {
      ctx.globalAlpha = 0.3 + b.depth;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function lerpColor(a, b, t) {
    return `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * t)).join(',')})`;
  }

  function drawPlatform(p) {
    const colors = {
      normal:   ['#5fd068', '#3a9b45'],
      moving:   ['#5ab8ff', '#2f7fd0'],
      breaking: ['#c9925e', '#8a5a33']
    }[p.type];
    ctx.save();
    if (p.broken) {
      ctx.globalAlpha = Math.max(0, 1 - p.fall / 12);
      ctx.translate(p.x + p.w / 2, p.y);
      ctx.rotate(p.fall * 0.03);
      ctx.translate(-(p.x + p.w / 2), -p.y);
    }
    roundRect(p.x, p.y, p.w, p.h, 7);
    ctx.fillStyle = colors[1];
    ctx.fill();
    roundRect(p.x, p.y, p.w, p.h - 4, 7);
    ctx.fillStyle = colors[0];
    ctx.fill();
    if (p.type === 'breaking') {
      ctx.strokeStyle = colors[1];
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(p.x + p.w * 0.35, p.y);
      ctx.lineTo(p.x + p.w * 0.45, p.y + p.h * 0.6);
      ctx.lineTo(p.x + p.w * 0.38, p.y + p.h);
      ctx.moveTo(p.x + p.w * 0.7, p.y);
      ctx.lineTo(p.x + p.w * 0.62, p.y + p.h);
      ctx.stroke();
    }
    ctx.restore();

    if (p.spring && !p.broken) {
      const sx = p.x + p.spring.ox;
      const h = 14 - p.spring.compressed * 8;
      ctx.strokeStyle = '#bbb';
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let i = 0; i <= 4; i++) {
        const yy = p.y - (h * i) / 4;
        ctx.lineTo(sx + (i % 2 ? 16 : 4), yy);
      }
      ctx.stroke();
      roundRect(sx, p.y - h - 4, 20, 5, 2);
      ctx.fillStyle = '#ffd84a';
      ctx.fill();
    }
  }

  function drawStar(s) {
    if (s.taken) return;
    const bob = Math.sin(s.t) * 4;
    ctx.save();
    ctx.translate(s.x, s.y + bob);
    ctx.rotate(s.t * 0.3);
    ctx.shadowColor = '#ffe46b';
    ctx.shadowBlur = 14;
    ctx.fillStyle = '#ffe46b';
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const r = i % 2 ? 5 : 12;
      const a = (Math.PI / 5) * i - Math.PI / 2;
      ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawPlayerAt(x, y, face, squash, vy) {
    const cx = x + 20, cy = y + 20;
    // squash when landing, stretch when rising fast
    const stretch = vy < 0 ? Math.min(-vy / 40, 0.15) : 0;
    const sx = 1 + squash * 0.25 - stretch;
    const sy = 1 - squash * 0.25 + stretch;

    ctx.save();
    ctx.translate(cx, y + 40);
    ctx.scale(sx, sy);
    ctx.translate(-cx, -(y + 40));

    // feet
    ctx.fillStyle = '#e0631f';
    roundRect(x + 6, y + 34, 11, 7, 3); ctx.fill();
    roundRect(x + 23, y + 34, 11, 7, 3); ctx.fill();

    // body
    const g = ctx.createRadialGradient(cx - 6, cy - 8, 4, cx, cy, 24);
    g.addColorStop(0, '#ffb347');
    g.addColorStop(1, '#ff7b1c');
    ctx.fillStyle = g;
    roundRect(x + 2, y + 2, 36, 34, 16);
    ctx.fill();

    // eyes
    const ex = face * 4;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.ellipse(cx - 7 + ex, cy - 4, 6, 7, 0, 0, Math.PI * 2);
    ctx.ellipse(cx + 7 + ex, cy - 4, 6, 7, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#1b1b2f';
    const lookY = vy > 4 ? 2 : vy < -4 ? -2 : 0;
    ctx.beginPath();
    ctx.arc(cx - 6 + ex * 1.4, cy - 4 + lookY, 3, 0, Math.PI * 2);
    ctx.arc(cx + 8 + ex * 1.4, cy - 4 + lookY, 3, 0, Math.PI * 2);
    ctx.fill();

    // mouth
    ctx.strokeStyle = '#7a2e05';
    ctx.lineWidth = 2;
    ctx.beginPath();
    if (vy > 8) ctx.arc(cx + ex, cy + 9, 3, 0, Math.PI * 2);           // "oh!" when falling fast
    else ctx.arc(cx + ex, cy + 5, 5, 0.15 * Math.PI, 0.85 * Math.PI);  // smile
    ctx.stroke();

    ctx.restore();
  }

  function drawPlayer() {
    const p = player;
    drawPlayerAt(p.x, p.y, p.face, p.squash, p.vy);
    // draw wrapped copy at the edges
    if (p.x < 0) drawPlayerAt(p.x + W, p.y, p.face, p.squash, p.vy);
    if (p.x + p.w > W) drawPlayerAt(p.x - W, p.y, p.face, p.squash, p.vy);
  }

  function drawParticles() {
    for (const pt of particles) {
      ctx.globalAlpha = Math.max(0, pt.life / pt.max);
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function text(str, x, y, size, color = '#fff', align = 'center', weight = 800) {
    ctx.font = `${weight} ${size}px system-ui, -apple-system, "Segoe UI", sans-serif`;
    ctx.textAlign = align;
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.fillText(str, x + 2, y + 3);
    ctx.fillStyle = color;
    ctx.fillText(str, x, y);
  }

  function drawHUD() {
    text(Math.floor(score).toString(), 16, 28, 28, '#fff', 'left');
    text('BEST ' + best, W - 16, 28, 14, 'rgba(255,255,255,.75)', 'right', 700);
  }

  function overlay() {
    ctx.fillStyle = 'rgba(10,12,35,.55)';
    ctx.fillRect(0, 0, W, H);
  }

  let menuT = 0;
  function drawMenu() {
    menuT += 0.05;
    overlay();
    text('SKY', W / 2, 150, 58, '#ffb347');
    text('JUMPER', W / 2, 205, 58, '#fff');
    const bounce = Math.abs(Math.sin(menuT * 1.4)) * 50;
    drawPlayerAt(W / 2 - 20, 330 - bounce, 1, bounce < 4 ? 1 - bounce / 4 : 0, Math.cos(menuT * 1.4) * -10);
    ctx.fillStyle = '#5fd068';
    roundRect(W / 2 - 35, 372, 70, 12, 6); ctx.fill();

    text('← → or A / D to move', W / 2, 440, 17, 'rgba(255,255,255,.9)', 'center', 600);
    text('Touch: tap left / right side', W / 2, 466, 15, 'rgba(255,255,255,.7)', 'center', 500);
    const pulse = 0.6 + Math.sin(menuT * 3) * 0.4;
    text('Press SPACE or tap to start', W / 2, 530, 19, `rgba(255,228,107,${pulse})`, 'center', 700);
    if (best) text('Best: ' + best, W / 2, 580, 16, 'rgba(255,255,255,.7)', 'center', 600);
  }

  function drawGameOver() {
    overlay();
    text('GAME OVER', W / 2, 200, 46, '#ff6b6b');
    text('Score', W / 2, 270, 18, 'rgba(255,255,255,.7)', 'center', 600);
    text(score.toString(), W / 2, 310, 52, '#fff');
    const isBest = score >= best && score > 0;
    text(isBest ? '★ New best! ★' : 'Best: ' + best, W / 2, 370, 20, isBest ? '#ffe46b' : 'rgba(255,255,255,.75)', 'center', 700);
    menuT += 0.05;
    const pulse = 0.6 + Math.sin(menuT * 3) * 0.4;
    text('Press SPACE or tap to retry', W / 2, 470, 19, `rgba(255,228,107,${pulse})`, 'center', 700);
  }

  function draw() {
    ctx.save();
    if (shake > 0) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
      shake *= 0.88;
      if (shake < 0.5) shake = 0;
    }
    drawBackground();
    if (state === 'menu') {
      drawMenu();
    } else {
      for (const p of platforms) drawPlatform(p);
      for (const s of stars) drawStar(s);
      drawParticles();
      if (state !== 'over') drawPlayer();
      drawHUD();
      if (state === 'over') drawGameOver();
      if (state === 'paused') {
        overlay();
        text('PAUSED', W / 2, H / 2 - 10, 42);
        text('Press P to resume', W / 2, H / 2 + 35, 16, 'rgba(255,255,255,.75)', 'center', 600);
      }
    }
    ctx.restore();
  }

  // ---------- Loop (fixed 60Hz timestep) ----------
  const STEP = 1000 / 60;
  let last = performance.now(), acc = 0;
  function frame(now) {
    acc += Math.min(now - last, 250);
    last = now;
    while (acc >= STEP) { update(); acc -= STEP; }
    draw();
    requestAnimationFrame(frame);
  }

  reset();
  heightClimbed = 0;
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
