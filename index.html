<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Sky Jumper</title>
<style>
  :root { --bg: #0f1530; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); overflow: hidden; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  canvas {
    display: block; border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
    image-rendering: auto;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(() => {
  // ---------- Setup ----------
  const W = 400, H = 640;              // logical resolution
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  function resize() {
    const scale = Math.min(window.innerWidth / W, window.innerHeight / H) * 0.96;
    const dpr = window.devicePixelRatio || 1;
    canvas.style.width = W * scale + 'px';
    canvas.style.height = H * scale + 'px';
    canvas.width = W * scale * dpr;
    canvas.height = H * scale * dpr;
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Constants ----------
  const GRAVITY = 0.38;
  const JUMP_V = -11.5;
  const SPRING_V = -19;
  const BOOTS_V = -14.5;
  const MOVE_ACCEL = 0.9;
  const MAX_VX = 7;
  const FRICTION = 0.86;
  const PLAT_W = 70, PLAT_H = 14;

  // ---------- Sound (synthesized with Web Audio, no files needed) ----------
  let audio = null;
  let muted = false;
  try { muted = localStorage.getItem('skyJumperMuted') === '1'; } catch {}

  function initAudio() {
    if (!audio) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audio = new AC();
    }
    if (audio.state === 'suspended') audio.resume();
  }

  // one oscillator note with a pitch slide and a quick fade-out
  function tone(freq, endFreq, dur, type = 'square', vol = 0.15, delay = 0) {
    if (!audio || muted) return;
    const t = audio.currentTime + delay;
    const osc = audio.createOscillator();
    const gain = audio.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    osc.frequency.exponentialRampToValueAtTime(endFreq, t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(gain).connect(audio.destination);
    osc.start(t);
    osc.stop(t + dur);
  }

  function noise(dur, vol = 0.2) {
    if (!audio || muted) return;
    const t = audio.currentTime;
    const buf = audio.createBuffer(1, audio.sampleRate * dur, audio.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
    const src = audio.createBufferSource();
    src.buffer = buf;
    const filter = audio.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 1200;
    const gain = audio.createGain();
    gain.gain.value = vol;
    src.connect(filter).connect(gain).connect(audio.destination);
    src.start(t);
  }

  const sfx = {
    jump:     () => tone(320 + Math.random() * 40, 640, 0.12, 'square', 0.08),
    spring:   () => { tone(200, 1200, 0.35, 'triangle', 0.18); tone(400, 1600, 0.3, 'square', 0.05); },
    break:    () => { noise(0.25, 0.25); tone(180, 60, 0.2, 'sawtooth', 0.08); },
    star:     () => { tone(880, 880, 0.08, 'square', 0.08); tone(1320, 1320, 0.16, 'square', 0.08, 0.07); },
    start:    () => [523, 659, 784].forEach((f, i) => tone(f, f, 0.12, 'square', 0.08, i * 0.08)),
    gameOver: () => { tone(440, 110, 0.7, 'sawtooth', 0.12); tone(220, 55, 0.8, 'triangle', 0.15, 0.1); },
    select:   () => tone(600, 900, 0.07, 'square', 0.07),
    newBest:  () => [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.15, 'square', 0.08, 0.6 + i * 0.1)),
    hit:      () => { noise(0.3, 0.3); tone(300, 80, 0.4, 'square', 0.12); },
    stomp:    () => { tone(150, 600, 0.12, 'square', 0.12); noise(0.08, 0.15); },
    powerup:  () => [440, 554, 659, 880].forEach((f, i) => tone(f, f * 1.02, 0.1, 'triangle', 0.14, i * 0.05)),
    shieldBreak: () => { tone(1200, 200, 0.3, 'triangle', 0.14); noise(0.15, 0.15); },
    unlock:   () => [659, 880, 1175].forEach((f, i) => tone(f, f, 0.14, 'triangle', 0.12, i * 0.09)),
    levelUp:  () => [392, 523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.16, 'square', 0.09, i * 0.09)),
    win:      () => [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, f, 0.2, 'square', 0.09, i * 0.12)),
    meteor:   () => tone(900, 150, 0.6, 'sawtooth', 0.05),
    thunder:  () => noise(1.2, 0.35)
  };

  function toggleMute() {
    muted = !muted;
    try { localStorage.setItem('skyJumperMuted', muted ? '1' : '0'); } catch {}
    if (!muted) { initAudio(); sfx.star(); }
  }

  // speaker button in the bottom-right corner
  const MUTE_BTN = { x: W - 44, y: H - 44, size: 32 };
  // character-select arrows on the title screen, and "change jumper" on game over
  const ARROW_L = { x: W / 2 - 120, y: 300, w: 44, h: 44 };
  const ARROW_R = { x: W / 2 + 76, y: 300, w: 44, h: 44 };
  const CHANGE_BTN = { x: W / 2 - 90, y: 515, w: 180, h: 40 };

  function hit(r, x, y) {
    return x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
  }
  function inMuteBtn(x, y) {
    return hit({ x: MUTE_BTN.x, y: MUTE_BTN.y, w: MUTE_BTN.size, h: MUTE_BTN.size }, x, y);
  }

  // ---------- Levels ----------
  // Each level is reached by score; clearing the last one wins the game.
  const LEVELS = [
    {
      name: 'Sunny Meadow', goal: 2500,
      sky: [[90, 160, 235], [190, 225, 255]], starAlpha: 0, cloud: [255, 255, 255],
      gap: [55, 95], moving: 0.14, breaking: 0.06, moveSpeed: 1.2,
      obstacles: ['bird'], obstacleRate: 0.10
    },
    {
      name: 'Stormy Clouds', goal: 6000,
      sky: [[45, 55, 95], [105, 115, 155]], starAlpha: 0.3, cloud: [80, 90, 120],
      gap: [70, 115], moving: 0.24, breaking: 0.16, moveSpeed: 2,
      obstacles: ['bird', 'spike'], obstacleRate: 0.16
    },
    {
      name: 'Outer Space', goal: 10000,
      sky: [[8, 8, 30], [45, 30, 95]], starAlpha: 1, cloud: null,
      gap: [80, 130], moving: 0.3, breaking: 0.22, moveSpeed: 2.6,
      obstacles: ['spike', 'ufo'], obstacleRate: 0.2, meteors: true
    }
  ];

  // ---------- Power-ups (unlocked as your score climbs) ----------
  const POWERUPS = {
    shield: { unlock: 300,  icon: '🛡️', name: 'Shield',      color: '#4da3ff', desc: 'blocks one hit' },
    magnet: { unlock: 1000, icon: '🧲', name: 'Magnet',      color: '#ff5a5a', desc: 'pulls in stars', time: 600 },
    boots:  { unlock: 2000, icon: '👟', name: 'Super Boots', color: '#3ddc84', desc: 'higher jumps',   time: 600 },
    rocket: { unlock: 3500, icon: '🚀', name: 'Jetpack',     color: '#ff9f1c', desc: 'blast upward',   time: 170 },
    double: { unlock: 5000, icon: '✖2', name: '×2 Score',    color: '#c77dff', desc: 'double points',  time: 600 }
  };
  const POWERUP_KEYS = Object.keys(POWERUPS);

  const DEATH_TEXT = {
    fell: 'You fell!',
    bird: 'Bonked by a bird!',
    spike: 'Ouch, spikes!',
    ufo: 'Zapped by a UFO!',
    meteor: 'Hit by a meteor!'
  };

  // ---------- State ----------
  let state = 'menu';   // menu | playing | paused | over | won
  let player, platforms, particles, stars, obstacles, score, best, shake;
  let level, banner, toasts, unlocked, lastObstacleY, lastItemY, meteorTimer, flash, deathCause;
  try { best = +localStorage.getItem('skyJumperBest') || 0; } catch { best = 0; }

  // sky colours ease toward the current level's palette
  const sky = { top: [...LEVELS[0].sky[0]], bottom: [...LEVELS[0].sky[1]], starAlpha: 0, cloudAlpha: 1, cloud: [255, 255, 255] };

  // background stars and clouds (parallax decoration)
  const bgStars = Array.from({ length: 70 }, () => ({
    x: Math.random() * W, y: Math.random() * H,
    r: Math.random() * 1.6 + 0.3, depth: Math.random() * 0.5 + 0.1
  }));
  const clouds = Array.from({ length: 6 }, () => ({
    x: Math.random() * W, y: Math.random() * H,
    s: 0.6 + Math.random() * 0.8, depth: 0.15 + Math.random() * 0.25, drift: 0.1 + Math.random() * 0.2
  }));

  function reset() {
    player = {
      x: W / 2 - 20, y: H - 150, w: 40, h: 40, vx: 0, vy: JUMP_V, face: 1, squash: 0,
      dead: false, invuln: 0, shield: false, magnet: 0, boots: 0, rocket: 0, double: 0
    };
    platforms = [];
    particles = [];
    stars = [];
    obstacles = [];
    toasts = [];
    unlocked = {};
    score = 0;
    shake = 0;
    flash = 0;
    level = 0;
    lastObstacleY = 0;
    lastItemY = 0;
    meteorTimer = 240;
    deathCause = 'fell';
    banner = { t: 150, level: 0 };
    // guaranteed starting platform under the player
    platforms.push(makePlatform(W / 2 - PLAT_W / 2, H - 60, 'normal'));
    let y = H - 60;
    while (y > -H) {
      const prev = y;
      y -= gapFor();
      spawnRow(y, prev, true);
    }
  }

  const lv = () => LEVELS[level];

  // gaps widen within a level as you approach its goal
  function gapFor() {
    const L = lv();
    const start = level ? LEVELS[level - 1].goal : 0;
    const t = Math.min(Math.max((score - start) / (L.goal - start), 0), 1);
    const min = L.gap[0] + t * 10;
    const max = L.gap[1] + t * 15;
    return min + Math.random() * (max - min);
  }

  function makePlatform(x, y, type) {
    const speed = lv().moveSpeed + Math.random() * 0.6;
    return {
      x, y, w: PLAT_W, h: PLAT_H, type,
      vx: type === 'moving' ? (Math.random() < 0.5 ? -1 : 1) * speed : 0,
      broken: false, fall: 0,
      spring: null, item: null
    };
  }

  // one "row": a platform, plus maybe a star, power-up or obstacle
  function spawnRow(y, prevY, initial = false) {
    const L = lv();
    const r = Math.random();
    let type = 'normal';
    if (r < L.moving) type = 'moving';
    else if (r < L.moving + L.breaking) type = 'breaking';
    const p = makePlatform(Math.random() * (W - PLAT_W), y, type);
    platforms.push(p);

    if (type === 'breaking') {
      // breaking platforms are traps, so make sure there's always a real one nearby
      platforms.push(makePlatform(Math.random() * (W - PLAT_W), y - 20 - Math.random() * 20, 'normal'));
    } else if (Math.random() < 0.07) {
      p.spring = { ox: 10 + Math.random() * (PLAT_W - 30), compressed: 0 };
    } else {
      maybeAddItem(p);
    }

    if (Math.random() < 0.12) {
      stars.push({ x: p.x + PLAT_W / 2, y: y - 45 - Math.random() * 30, t: Math.random() * 6, taken: false });
    }

    if (!initial) maybeAddObstacle((y + prevY) / 2, p);
  }

  function maybeAddItem(p) {
    const available = POWERUP_KEYS.filter(k => unlocked[k]);
    if (!available.length || p.y > lastItemY - 500 || Math.random() > 0.09) return;
    p.item = available[Math.floor(Math.random() * available.length)];
    lastItemY = p.y;
  }

  function maybeAddObstacle(y, nearPlat) {
    const L = lv();
    if (score < 400 || y > lastObstacleY - 260 || Math.random() > L.obstacleRate) return;
    const kind = L.obstacles[Math.floor(Math.random() * L.obstacles.length)];
    let o;
    if (kind === 'bird') {
      const dir = Math.random() < 0.5 ? -1 : 1;
      o = { kind, x: Math.random() * (W - 36), y, w: 36, h: 24, vx: dir * (1.3 + level * 0.6), t: 0, stompable: true };
    } else if (kind === 'ufo') {
      o = { kind, x: Math.random() * (W - 46), y, w: 46, h: 24, baseX: 0, t: Math.random() * 6, stompable: true };
      o.baseX = o.x;
    } else {
      // static spike ball: keep it away from the nearby platform so there's a way past
      let x, tries = 0;
      do { x = 15 + Math.random() * (W - 30); tries++; }
      while (Math.abs(x - (nearPlat.x + PLAT_W / 2)) < 70 && tries < 12);
      o = { kind, x: x - 15, y: y - 15, w: 30, h: 30, t: 0, stompable: false };
    }
    obstacles.push(o);
    lastObstacleY = y;
  }

  function addPlatforms() {
    let top = Math.min(...platforms.map(p => p.y));
    while (top > -100) {
      const prev = top;
      top -= gapFor();
      spawnRow(top, prev);
    }
  }

  function burst(x, y, color, n = 10, spread = 3) {
    for (let i = 0; i < n; i++) {
      particles.push({
        x, y,
        vx: (Math.random() - 0.5) * spread * 2,
        vy: (Math.random() - 0.8) * spread,
        life: 30 + Math.random() * 20, max: 50, color,
        r: 2 + Math.random() * 2.5
      });
    }
  }

  function toast(text, color = '#fff') {
    toasts.push({ text, color, t: 150 });
    if (toasts.length > 3) toasts.splice(1, 1); // don't let messages pile up
  }

  // ---------- Input ----------
  const keys = {};
  let touchDir = 0;

  window.addEventListener('keydown', e => {
    keys[e.code] = true;
    initAudio();
    if (e.code === 'KeyM') toggleMute();
    if (state === 'menu') {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') changeCharacter(-1);
      if (e.code === 'ArrowRight' || e.code === 'KeyD') changeCharacter(1);
    }
    if ((state === 'over' || state === 'won') && e.code === 'KeyC') { state = 'menu'; sfx.select(); }
    if (['Space', 'Enter'].includes(e.code)) {
      e.preventDefault();
      if (state === 'menu' || state === 'over' || state === 'won') start();
    }
    if (e.code === 'KeyP' || e.code === 'Escape') {
      if (state === 'playing') state = 'paused';
      else if (state === 'paused') state = 'playing';
    }
    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.code)) e.preventDefault();
  });
  window.addEventListener('keyup', e => { keys[e.code] = false; });

  function pointerX(e) {
    const rect = canvas.getBoundingClientRect();
    return (e.clientX - rect.left) / rect.width * W;
  }
  function pointerY(e) {
    const rect = canvas.getBoundingClientRect();
    return (e.clientY - rect.top) / rect.height * H;
  }
  canvas.addEventListener('pointerdown', e => {
    initAudio();
    const px = pointerX(e), py = pointerY(e);
    if (inMuteBtn(px, py)) { toggleMute(); return; }
    if (state === 'menu') {
      if (hit(ARROW_L, px, py)) { changeCharacter(-1); return; }
      if (hit(ARROW_R, px, py)) { changeCharacter(1); return; }
    }
    if ((state === 'over' || state === 'won') && hit(CHANGE_BTN, px, py)) { state = 'menu'; sfx.select(); return; }
    if (state === 'paused') { state = 'playing'; return; }
    if (state !== 'playing') { start(); return; }
    touchDir = px < W / 2 ? -1 : 1;
  });
  canvas.addEventListener('pointermove', e => {
    if (touchDir !== 0 && e.buttons) touchDir = pointerX(e) < W / 2 ? -1 : 1;
  });
  window.addEventListener('pointerup', () => { touchDir = 0; });
  window.addEventListener('pointercancel', () => { touchDir = 0; });

  function start() {
    reset();
    state = 'playing';
    sfx.start();
  }

  // ---------- Update ----------
  function addScore(n) {
    score += n * (player.double > 0 ? 2 : 1);
  }

  function overlaps(a, b, shrink = 6) {
    return a.x + shrink < b.x + b.w && a.x + a.w - shrink > b.x &&
           a.y + shrink < b.y + b.h && a.y + a.h - shrink > b.y;
  }

  function collectPowerup(type, x, y) {
    const P = POWERUPS[type];
    if (type === 'shield') player.shield = true;
    else player[type] = P.time;
    burst(x, y, P.color, 20, 4);
    sfx.powerup();
    toast(`${P.icon}  ${P.name}!`, P.color);
  }

  function killObstacle(o, points) {
    o.gone = true;
    burst(o.x + o.w / 2, o.y + o.h / 2, o.kind === 'ufo' ? '#7cf7d4' : o.kind === 'bird' ? '#ff7aa8' : '#aaa', 18, 4);
    if (points) addScore(points);
  }

  function die(cause) {
    if (player.dead) return;
    player.dead = true;
    deathCause = cause;
    player.vy = -8;
    player.vx = 0;
    player.rocket = 0;
    shake = 12;
    sfx.hit();
  }

  function updateSky() {
    const L = lv();
    const k = 0.02;
    for (let i = 0; i < 3; i++) {
      sky.top[i] += (L.sky[0][i] - sky.top[i]) * k;
      sky.bottom[i] += (L.sky[1][i] - sky.bottom[i]) * k;
    }
    sky.starAlpha += (L.starAlpha - sky.starAlpha) * k;
    sky.cloudAlpha += ((L.cloud ? 1 : 0) - sky.cloudAlpha) * k;
    if (L.cloud) sky.cloud = L.cloud;
    for (const c of clouds) {
      c.x += c.drift;
      if (c.x > W + 80) c.x = -80;
    }
  }

  function update() {
    updateSky();
    if (state !== 'playing') return;

    // --- movement ---
    const left = !player.dead && (keys.ArrowLeft || keys.KeyA || touchDir < 0);
    const right = !player.dead && (keys.ArrowRight || keys.KeyD || touchDir > 0);
    if (left) { player.vx -= MOVE_ACCEL; player.face = -1; }
    if (right) { player.vx += MOVE_ACCEL; player.face = 1; }
    if (!left && !right) player.vx *= FRICTION;
    player.vx = Math.max(-MAX_VX, Math.min(MAX_VX, player.vx));

    if (player.rocket > 0) {
      player.vy = -15;
      player.rocket--;
      for (let i = 0; i < 2; i++) {
        particles.push({
          x: player.x + 20 + (Math.random() - 0.5) * 10, y: player.y + 40,
          vx: (Math.random() - 0.5) * 1.5, vy: 3 + Math.random() * 2,
          life: 20, max: 20, color: Math.random() < 0.5 ? '#ffb347' : '#ff5a1f', r: 3 + Math.random() * 3
        });
      }
    } else {
      player.vy += GRAVITY;
    }
    player.x += player.vx;
    player.y += player.vy;
    player.squash *= 0.85;
    if (player.invuln > 0) player.invuln--;
    if (player.magnet > 0) player.magnet--;
    if (player.boots > 0) player.boots--;
    if (player.double > 0) player.double--;

    // horizontal wrap
    if (player.x + player.w / 2 < 0) player.x += W;
    if (player.x + player.w / 2 > W) player.x -= W;

    // --- platform collisions (only while falling) ---
    if (player.vy > 0 && !player.dead) {
      const feet = player.y + player.h;
      const prevFeet = feet - player.vy;
      for (const p of platforms) {
        if (p.broken) continue;
        const overlapX = player.x + player.w - 8 > p.x && player.x + 8 < p.x + p.w;
        if (!overlapX || prevFeet > p.y + 2 || feet < p.y) continue;

        if (p.spring) {
          const sx = p.x + p.spring.ox;
          if (player.x + player.w - 6 > sx && player.x + 6 < sx + 20) {
            player.y = p.y - player.h;
            player.vy = SPRING_V;
            p.spring.compressed = 1;
            player.squash = 1;
            burst(sx + 10, p.y, '#ffd84a', 14, 4);
            sfx.spring();
            break;
          }
        }

        if (p.type === 'breaking') {
          p.broken = true;
          burst(p.x + p.w / 2, p.y + 6, '#b07a4a', 14, 3);
          sfx.break();
          continue; // fall through it
        }

        player.y = p.y - player.h;
        player.vy = player.boots > 0 ? BOOTS_V : JUMP_V;
        player.squash = 1;
        burst(player.x + player.w / 2, p.y, player.boots > 0 ? '#3ddc84' : 'rgba(255,255,255,.8)', 6, 1.6);
        sfx.jump();
        break;
      }
    }

    // --- platforms ---
    for (const p of platforms) {
      if (p.type === 'moving') {
        p.x += p.vx;
        if (p.x < 0 || p.x + p.w > W) { p.vx *= -1; p.x = Math.max(0, Math.min(W - p.w, p.x)); }
      }
      if (p.broken) { p.fall += 0.5; p.y += p.fall; }
      if (p.spring) p.spring.compressed *= 0.85;

      // power-up pickup
      if (p.item && !player.dead) {
        const box = { x: p.x + p.w / 2 - 14, y: p.y - 32, w: 28, h: 28 };
        if (overlaps(player, box, 4)) {
          collectPowerup(p.item, box.x + 14, box.y + 14);
          p.item = null;
        }
      }
    }

    // --- stars ---
    for (const s of stars) {
      s.t += 0.08;
      if (s.taken) continue;
      const dx = (player.x + player.w / 2) - s.x;
      const dy = (player.y + player.h / 2) - s.y;
      const dist = Math.hypot(dx, dy);
      if (player.magnet > 0 && dist < 220) {
        s.x += dx / dist * 6;
        s.y += dy / dist * 6;
      }
      if (dist < 30 && !player.dead) {
        s.taken = true;
        addScore(250);
        burst(s.x, s.y, '#ffe46b', 18, 4);
        sfx.star();
      }
    }

    // --- obstacles ---
    if (lv().meteors && !player.dead && --meteorTimer <= 0) {
      meteorTimer = 160 + Math.random() * 200;
      obstacles.push({ kind: 'meteor', x: 20 + Math.random() * (W - 68), y: -60, w: 28, h: 28, vx: (Math.random() - 0.5) * 2, vy: 6, warn: 70, t: 0, stompable: false });
    }
    for (const o of obstacles) {
      o.t++;
      if (o.kind === 'bird') {
        o.x += o.vx;
        if (o.x < 0 || o.x + o.w > W) o.vx *= -1;
      } else if (o.kind === 'ufo') {
        o.x = o.baseX + Math.sin(o.t * 0.03) * 90;
        o.x = Math.max(0, Math.min(W - o.w, o.x));
      } else if (o.kind === 'meteor') {
        if (o.warn > 0) { o.warn--; if (o.warn === 0) sfx.meteor(); continue; }
        o.x += o.vx;
        o.y += o.vy;
        if (o.t % 2 === 0) {
          particles.push({ x: o.x + 14, y: o.y + 6, vx: (Math.random() - 0.5), vy: -1, life: 18, max: 18, color: '#ff8c42', r: 3 + Math.random() * 3 });
        }
      }

      if (player.dead || o.gone || !overlaps(player, o, 7)) continue;

      const prevFeet = player.y + player.h - player.vy;
      if (player.rocket > 0) {
        killObstacle(o, 100);
        sfx.stomp();
      } else if (o.stompable && player.vy > 0 && prevFeet <= o.y + 10) {
        killObstacle(o, 150);
        player.vy = JUMP_V * 1.1;
        player.squash = 1;
        sfx.stomp();
      } else if (player.invuln > 0) {
        // just got hit, briefly safe
      } else if (player.shield) {
        player.shield = false;
        player.invuln = 60;
        killObstacle(o, 0);
        sfx.shieldBreak();
      } else {
        die(o.kind);
      }
    }

    // --- camera scroll ---
    const line = H * 0.4;
    if (player.y < line && !player.dead) {
      const dy = line - player.y;
      player.y = line;
      addScore(dy * 0.5);
      for (const p of platforms) p.y += dy;
      for (const s of stars) s.y += dy;
      for (const o of obstacles) if (!o.warn) o.y += dy;
      for (const pt of particles) pt.y += dy;
      lastObstacleY += dy;
      lastItemY += dy;
      for (const b of bgStars) {
        b.y += dy * b.depth;
        if (b.y > H) { b.y -= H; b.x = Math.random() * W; }
      }
      for (const c of clouds) {
        c.y += dy * c.depth;
        if (c.y > H + 60) { c.y -= H + 120; c.x = Math.random() * W; }
      }
    }

    // --- cleanup & spawn ---
    platforms = platforms.filter(p => p.y < H + 60);
    stars = stars.filter(s => s.y < H + 40);
    obstacles = obstacles.filter(o => !o.gone && o.y < H + 60);
    if (!player.dead) addPlatforms();

    for (const pt of particles) {
      pt.vy += 0.15; pt.x += pt.vx; pt.y += pt.vy; pt.life--;
    }
    particles = particles.filter(pt => pt.life > 0);

    if (banner.t > 0) banner.t--;
    if (toasts.length && --toasts[0].t <= 0) toasts.shift();

    // stormy level: random lightning
    if (level === 1 && Math.random() < 1 / 400) { flash = 1; sfx.thunder(); }
    flash *= 0.9;

    // --- unlocks & level progress ---
    if (!player.dead) {
      for (const k of POWERUP_KEYS) {
        if (!unlocked[k] && score >= POWERUPS[k].unlock) {
          unlocked[k] = true;
          toast(`Unlocked ${POWERUPS[k].icon} ${POWERUPS[k].name}: ${POWERUPS[k].desc}`, POWERUPS[k].color);
          sfx.unlock();
        }
      }
      if (score >= lv().goal) {
        if (level < LEVELS.length - 1) {
          level++;
          banner = { t: 170, level };
          shake = 6;
          sfx.levelUp();
          burst(W / 2, H / 2, '#ffe46b', 40, 6);
        } else {
          finish('won');
          return;
        }
      }
    }

    // --- game over ---
    if (player.y > H + 20) finish('over');
  }

  function finish(result) {
    state = result;
    score = Math.floor(score);
    if (result === 'won') {
      sfx.win();
      burst(W / 2, H / 2, '#ffe46b', 60, 8);
    } else {
      shake = 14;
      sfx.gameOver();
    }
    if (score > best) {
      if (result === 'over') sfx.newBest();
      best = score;
      try { localStorage.setItem('skyJumperBest', best); } catch {}
    }
  }

  // ---------- Drawing ----------
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, rgb(sky.top));
    g.addColorStop(1, rgb(sky.bottom));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    if (sky.starAlpha > 0.02) {
      ctx.fillStyle = '#fff';
      for (const b of bgStars) {
        ctx.globalAlpha = (0.3 + b.depth) * sky.starAlpha;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    if (sky.cloudAlpha > 0.02) {
      ctx.globalAlpha = 0.55 * sky.cloudAlpha;
      ctx.fillStyle = rgb(sky.cloud);
      for (const c of clouds) {
        ctx.beginPath();
        ctx.ellipse(c.x, c.y, 40 * c.s, 16 * c.s, 0, 0, Math.PI * 2);
        ctx.ellipse(c.x - 22 * c.s, c.y + 4 * c.s, 24 * c.s, 12 * c.s, 0, 0, Math.PI * 2);
        ctx.ellipse(c.x + 18 * c.s, c.y - 8 * c.s, 26 * c.s, 16 * c.s, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  function rgb(c) {
    return `rgb(${c.map(Math.round).join(',')})`;
  }

  function drawPowerIcon(type, x, y, r, alpha = 1) {
    const P = POWERUPS[type];
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.shadowColor = P.color;
    ctx.shadowBlur = 12;
    ctx.fillStyle = P.color;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255,255,255,.85)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = `800 ${Math.round(r * (type === 'double' ? 0.9 : 1.1))}px system-ui, "Apple Color Emoji", "Segoe UI Emoji", sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(P.icon, x, y + 1);
    ctx.restore();
  }

  function drawPlatform(p) {
    const colors = {
      normal:   ['#5fd068', '#3a9b45'],
      moving:   ['#4aa3f0', '#2563b0'],
      breaking: ['#c9925e', '#8a5a33']
    }[p.type];
    ctx.save();
    if (p.broken) {
      ctx.globalAlpha = Math.max(0, 1 - p.fall / 12);
      ctx.translate(p.x + p.w / 2, p.y);
      ctx.rotate(p.fall * 0.03);
      ctx.translate(-(p.x + p.w / 2), -p.y);
    }
    roundRect(p.x, p.y, p.w, p.h, 7);
    ctx.fillStyle = colors[1];
    ctx.fill();
    roundRect(p.x, p.y, p.w, p.h - 4, 7);
    ctx.fillStyle = colors[0];
    ctx.fill();
    if (p.type === 'breaking') {
      ctx.strokeStyle = colors[1];
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(p.x + p.w * 0.35, p.y);
      ctx.lineTo(p.x + p.w * 0.45, p.y + p.h * 0.6);
      ctx.lineTo(p.x + p.w * 0.38, p.y + p.h);
      ctx.moveTo(p.x + p.w * 0.7, p.y);
      ctx.lineTo(p.x + p.w * 0.62, p.y + p.h);
      ctx.stroke();
    }
    ctx.restore();

    if (p.spring && !p.broken) {
      const sx = p.x + p.spring.ox;
      const h = 14 - p.spring.compressed * 8;
      ctx.strokeStyle = '#bbb';
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let i = 0; i <= 4; i++) {
        const yy = p.y - (h * i) / 4;
        ctx.lineTo(sx + (i % 2 ? 16 : 4), yy);
      }
      ctx.stroke();
      roundRect(sx, p.y - h - 4, 20, 5, 2);
      ctx.fillStyle = '#ffd84a';
      ctx.fill();
    }

    if (p.item) {
      const bob = Math.sin(performance.now() / 250 + p.x) * 3;
      drawPowerIcon(p.item, p.x + p.w / 2, p.y - 18 + bob, 13);
    }
  }

  function drawObstacle(o) {
    const cx = o.x + o.w / 2, cy = o.y + o.h / 2;
    ctx.save();
    if (o.kind === 'bird') {
      const dir = o.vx > 0 ? 1 : -1;
      const flap = Math.sin(o.t * 0.4) * 9;
      ctx.translate(cx, cy);
      ctx.scale(dir, 1);
      // wings
      ctx.fillStyle = '#c2185b';
      ctx.beginPath();
      ctx.moveTo(-4, -2); ctx.lineTo(-14, -8 - flap); ctx.lineTo(6, -2);
      ctx.fill();
      // body
      ctx.fillStyle = '#ff4f8b';
      ctx.beginPath();
      ctx.ellipse(0, 2, 15, 10, 0, 0, Math.PI * 2);
      ctx.fill();
      // angry eye & brow
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(7, -1, 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#1b1b2f';
      ctx.beginPath(); ctx.arc(8, -1, 2, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#1b1b2f';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(3, -6); ctx.lineTo(11, -4); ctx.stroke();
      // beak
      ctx.fillStyle = '#ffb000';
      ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(21, 3); ctx.lineTo(14, 6); ctx.fill();
    } else if (o.kind === 'spike') {
      ctx.translate(cx, cy + Math.sin(o.t * 0.05) * 3);
      ctx.rotate(o.t * 0.02);
      ctx.fillStyle = '#e0e4ee';
      ctx.beginPath();
      for (let i = 0; i < 16; i++) {
        const r = i % 2 ? 9 : 17;
        const a = (Math.PI / 8) * i;
        ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      }
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#4a4f63';
      ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ff4d4d';
      ctx.beginPath(); ctx.arc(0, 0, 3.5, 0, Math.PI * 2); ctx.fill();
    } else if (o.kind === 'ufo') {
      ctx.translate(cx, cy);
      // tractor beam
      ctx.fillStyle = 'rgba(124,247,212,.12)';
      ctx.beginPath(); ctx.moveTo(-8, 6); ctx.lineTo(8, 6); ctx.lineTo(18, 40); ctx.lineTo(-18, 40); ctx.fill();
      // dome
      ctx.fillStyle = 'rgba(160,230,255,.85)';
      ctx.beginPath(); ctx.ellipse(0, -4, 11, 10, 0, Math.PI, 0); ctx.fill();
      ctx.fillStyle = '#7cf7d4';
      ctx.beginPath(); ctx.arc(0, -6, 4, 0, Math.PI * 2); ctx.fill();
      // saucer
      ctx.fillStyle = '#8e95ad';
      ctx.beginPath(); ctx.ellipse(0, 2, 23, 7, 0, 0, Math.PI * 2); ctx.fill();
      for (let i = -2; i <= 2; i++) {
        ctx.fillStyle = (Math.floor(o.t / 10) + i) % 2 ? '#ffe46b' : '#ff5a5a';
        ctx.beginPath(); ctx.arc(i * 8, 3, 2, 0, Math.PI * 2); ctx.fill();
      }
    } else if (o.kind === 'meteor') {
      if (o.warn > 0) {
        // warning marker at the top of the screen
        if (Math.floor(o.warn / 8) % 2) {
          ctx.fillStyle = '#ff4d4d';
          ctx.beginPath();
          ctx.moveTo(cx, 56); ctx.lineTo(cx + 14, 82); ctx.lineTo(cx - 14, 82);
          ctx.closePath(); ctx.fill();
          ctx.fillStyle = '#fff';
          ctx.font = '900 16px system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('!', cx, 73);
        }
      } else {
        ctx.translate(cx, cy);
        ctx.shadowColor = '#ff8c42';
        ctx.shadowBlur = 16;
        ctx.fillStyle = '#7a4a2e';
        ctx.beginPath(); ctx.arc(0, 0, 14, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#5a3420';
        ctx.beginPath();
        ctx.arc(-4, -3, 4, 0, Math.PI * 2);
        ctx.arc(5, 4, 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();
  }

  function drawStar(s) {
    if (s.taken) return;
    const bob = Math.sin(s.t) * 4;
    ctx.save();
    ctx.translate(s.x, s.y + bob);
    ctx.rotate(s.t * 0.3);
    ctx.shadowColor = '#ffe46b';
    ctx.shadowBlur = 14;
    ctx.fillStyle = '#ffe46b';
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const r = i % 2 ? 5 : 12;
      const a = (Math.PI / 5) * i - Math.PI / 2;
      ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // shared face parts: two eyes that look where you're heading
  function drawEyes(cx, cy, face, vy, gap = 7, rx = 6, ry = 7, pupil = 3) {
    const ex = face * 4;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.ellipse(cx - gap + ex, cy, rx, ry, 0, 0, Math.PI * 2);
    ctx.ellipse(cx + gap + ex, cy, rx, ry, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#1b1b2f';
    const lookY = vy > 4 ? 2 : vy < -4 ? -2 : 0;
    ctx.beginPath();
    ctx.arc(cx - gap + 1 + ex * 1.4, cy + lookY, pupil, 0, Math.PI * 2);
    ctx.arc(cx + gap + 1 + ex * 1.4, cy + lookY, pupil, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawMouth(cx, cy, face, vy, color, size = 5) {
    const ex = face * 4;
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    if (vy > 8) ctx.arc(cx + ex, cy + 4, 3, 0, Math.PI * 2);                // "oh!" when falling fast
    else ctx.arc(cx + ex, cy, size, 0.15 * Math.PI, 0.85 * Math.PI);       // smile
    ctx.stroke();
  }

  function feet(x, y, color) {
    ctx.fillStyle = color;
    roundRect(x + 6, y + 34, 11, 7, 3); ctx.fill();
    roundRect(x + 23, y + 34, 11, 7, 3); ctx.fill();
  }

  function gradient(cx, cy, light, dark) {
    const g = ctx.createRadialGradient(cx - 6, cy - 8, 4, cx, cy, 24);
    g.addColorStop(0, light);
    g.addColorStop(1, dark);
    return g;
  }

  // Each jumper draws itself into a 40x40 box at (x, y)
  const CHARACTERS = [
    {
      name: 'Blobby',
      draw(x, y, face, vy) {
        const cx = x + 20, cy = y + 20;
        feet(x, y, '#e0631f');
        ctx.fillStyle = gradient(cx, cy, '#ffb347', '#ff7b1c');
        roundRect(x + 2, y + 2, 36, 34, 16); ctx.fill();
        drawEyes(cx, cy - 4, face, vy);
        drawMouth(cx, cy + 5, face, vy, '#7a2e05');
      }
    },
    {
      name: 'Froggy',
      draw(x, y, face, vy) {
        const cx = x + 20, cy = y + 20;
        feet(x, y, '#2e8b3e');
        ctx.fillStyle = gradient(cx, cy, '#8ee07a', '#3fae4f');
        roundRect(x, y + 8, 40, 28, 14); ctx.fill();
        // eye bumps on top of the head
        ctx.beginPath();
        ctx.arc(cx - 9 + face * 2, y + 9, 8, 0, Math.PI * 2);
        ctx.arc(cx + 9 + face * 2, y + 9, 8, 0, Math.PI * 2);
        ctx.fill();
        drawEyes(cx - 2 + face * 0.5, y + 9, face * 0.5, vy, 9, 5, 5, 2.5);
        // cheeks
        ctx.fillStyle = 'rgba(255,120,140,.5)';
        ctx.beginPath();
        ctx.arc(cx - 13, cy + 8, 3, 0, Math.PI * 2);
        ctx.arc(cx + 13, cy + 8, 3, 0, Math.PI * 2);
        ctx.fill();
        drawMouth(cx, cy + 6, face, vy, '#1f5e28', 9);
      }
    },
    {
      name: 'Kitty',
      draw(x, y, face, vy) {
        const cx = x + 20, cy = y + 20;
        feet(x, y, '#7d7f8f');
        ctx.fillStyle = gradient(cx, cy, '#d6d8e4', '#9a9db0');
        // ears
        ctx.beginPath();
        ctx.moveTo(x + 4, y + 12); ctx.lineTo(x + 8, y - 4); ctx.lineTo(x + 18, y + 6);
        ctx.moveTo(x + 36, y + 12); ctx.lineTo(x + 32, y - 4); ctx.lineTo(x + 22, y + 6);

        roundRect(x + 2, y + 4, 36, 32, 15); ctx.fill();

        ctx.moveTo(x + 32, y + 7); ctx.lineTo(x + 31, y + 1); ctx.lineTo(x + 26, y + 6);
        ctx.fill();

        // whiskers
        ctx.strokeStyle = 'rgba(60,60,80,.6)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x - 2, cy + 6); ctx.lineTo(x + 10, cy + 7);
        ctx.moveTo(x - 2, cy + 11); ctx.lineTo(x + 10, cy + 9);
        ctx.moveTo(x + 42, cy + 6); ctx.lineTo(x + 30, cy + 7);
        ctx.moveTo(x + 42, cy + 11); ctx.lineTo(x + 30, cy + 9);

        drawMouth(cx, cy + 8, face, vy, '#5a5a70', 3);
      }
    },
    {
      name: 'Robo',
      draw(x, y, face, vy) {
        const cx = x + 20, cy = y + 20;
        feet(x, y, '#555b6e');
        // antenna with blinking light
        ctx.strokeStyle = '#8a90a6';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(cx, y + 4); ctx.lineTo(cx, y - 5); ctx.stroke();
        ctx.fillStyle = Math.floor(performance.now() / 400) % 2 ? '#ff4d4d' : '#ffb3b3';
        ctx.beginPath(); ctx.arc(cx, y - 6, 3, 0, Math.PI * 2); ctx.fill();
        // body
        const g = ctx.createLinearGradient(x, y, x + 40, y + 36);
        g.addColorStop(0, '#e3e7f1');
        g.addColorStop(1, '#9aa1b8');
        ctx.fillStyle = g;
        roundRect(x + 2, y + 3, 36, 33, 6); ctx.fill();
        // visor with glowing eyes
        ctx.fillStyle = '#1b1f33';

        ctx.fillStyle = '#4df0ff';
        ctx.shadowColor = '#4df0ff';
        ctx.shadowBlur = 6;

        const eh = vy > 8 ? 6 : 4;

        ctx.lineWidth = 1.5;

      }
    },
    {
      name: 'Pengu',
      draw(x, y, face, vy) {
        const cx = x + 20, cy = y + 20;
        feet(x, y, '#ff9a1f');
        ctx.fillStyle = gradient(cx, cy, '#5468a8', '#2a3466');
        ctx.beginPath();
        ctx.ellipse(cx, cy + 1, 18, 18, 0, 0, Math.PI * 2);
        ctx.fill();
        // white belly/face
        ctx.fillStyle = '#f4f6ff';

        ctx.ellipse(cx + face * 2, cy + 5, 12, 13, 0, 0, Math.PI * 2);
        ctx.fill();
        drawEyes(cx, cy - 4, face, vy, 6, 4, 5, 2.5);

        ctx.beginPath();
        if (vy > 8) {
          ctx.ellipse(bx, cy + 5, 4, 4, 0, 0, Math.PI * 2);
        } else {
          ctx.moveTo(bx - 4, cy + 2); ctx.lineTo(bx + 4, cy + 2); ctx.lineTo(bx + face * 6, cy + 6);
        }
        ctx.fill();
      }
    },
    {
      name: 'Boo',
      draw(x, y, face, vy) {
        const cx = x + 20, cy = y + 20;
        const t = performance.now() / 150;
        ctx.globalAlpha = 0.92;
        ctx.fillStyle = gradient(cx, cy, '#ffffff', '#cfd6ff');
        ctx.beginPath();
        ctx.arc(cx, y + 18, 17, Math.PI, 0);
        ctx.lineTo(x + 37, y + 38);
        // wavy tail
        for (let i = 0; i < 4; i++) {
          const wx = x + 37 - (i + 1) * 8.5;
          ctx.quadraticCurveTo(wx + 4.25, y + 32 + Math.sin(t + i) * 3, wx, y + 38);
        }
        ctx.closePath();
        ctx.fill();
        ctx.globalAlpha = 1;
        // dark oval eyes
        const ex = face * 4;
        const lookY = vy > 4 ? 2 : vy < -4 ? -2 : 0;
        ctx.fillStyle = '#2a2a48';
        ctx.beginPath();
        ctx.ellipse(cx - 6 + ex, cy - 3 + lookY, 3, 5, 0, 0, Math.PI * 2);
        ctx.ellipse(cx + 6 + ex, cy - 3 + lookY, 3, 5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(cx + ex, cy + 8, vy > 8 ? 4 : 3, vy > 8 ? 5 : 2.5, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  ];

  let charIndex = 0;
  try { charIndex = Math.max(0, CHARACTERS.findIndex(c => c.name === localStorage.getItem('skyJumperChar'))); } catch {}

  function changeCharacter(dir) {
    charIndex = (charIndex + dir + CHARACTERS.length) % CHARACTERS.length;
    try { localStorage.setItem('skyJumperChar', CHARACTERS[charIndex].name); } catch {}
    sfx.select();
  }

  function drawPlayerAt(x, y, face, squash, vy) {
    const cx = x + 20;
    // squash when landing, stretch when rising fast
    const stretch = vy < 0 ? Math.min(-vy / 40, 0.15) : 0;
    const sx = 1 + squash * 0.25 - stretch;
    const sy = 1 - squash * 0.25 + stretch;

    ctx.save();
    ctx.translate(cx, y + 40);
    ctx.scale(sx, sy);
    ctx.translate(-cx, -(y + 40));
    CHARACTERS[charIndex].draw(x, y, face, vy);
    ctx.restore();
  }

  function drawPlayer() {
    const p = player;
    // blink while briefly invulnerable after a shield hit
    if (p.invuln > 0 && Math.floor(p.invuln / 5) % 2) return;
    const copies = [p.x];
    if (p.x < 0) copies.push(p.x + W);              // wrapped copy at the edges
    if (p.x + p.w > W) copies.push(p.x - W);
    for (const x of copies) {
      const cx = x + 20, cy = p.y + 20;
      ctx.save();
      if (p.dead) {
        ctx.translate(cx, cy);
        ctx.rotate(p.y * 0.04);
        ctx.translate(-cx, -cy);
      }
      if (p.rocket > 0) {
        // jetpack tanks on either side
        ctx.fillStyle = '#9aa1b8';
        roundRect(x - 6, p.y + 12, 9, 22, 4); ctx.fill();
        roundRect(x + 37, p.y + 12, 9, 22, 4); ctx.fill();
        ctx.fillStyle = '#ff5a1f';
        roundRect(x - 6, p.y + 12, 9, 5, 2); ctx.fill();
        roundRect(x + 37, p.y + 12, 9, 5, 2); ctx.fill();
      }
      if (p.boots > 0) {
        ctx.fillStyle = 'rgba(61,220,132,.45)';
        ctx.beginPath();
        ctx.ellipse(cx, p.y + 40, 22, 6, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      drawPlayerAt(x, p.y, p.face, p.squash, p.vy);
      if (p.magnet > 0) {
        const pulse = (performance.now() / 600) % 1;
        ctx.strokeStyle = `rgba(255,90,90,${0.6 * (1 - pulse)})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(cx, cy, 26 + pulse * 30, 0, Math.PI * 2);
        ctx.stroke();
      }
      if (p.shield) {
        const g = ctx.createRadialGradient(cx, cy, 14, cx, cy, 32);
        g.addColorStop(0, 'rgba(77,163,255,0)');
        g.addColorStop(1, 'rgba(77,163,255,.45)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(cx, cy, 32, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(160,210,255,.9)';
        ctx.lineWidth = 2;
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  function drawParticles() {
    for (const pt of particles) {
      ctx.globalAlpha = Math.max(0, pt.life / pt.max);
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function text(str, x, y, size, color = '#fff', align = 'center', weight = 800) {
    ctx.font = `${weight} ${size}px system-ui, -apple-system, "Segoe UI", sans-serif`;
    ctx.textAlign = align;
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.fillText(str, x + 2, y + 3);
    ctx.fillStyle = color;
    ctx.fillText(str, x, y);
  }

  function drawHUD() {
    text(Math.floor(score).toString(), 16, 28, 28, '#fff', 'left');
    text('BEST ' + best, W - 16, 28, 14, 'rgba(255,255,255,.75)', 'right', 700);

    // level and progress toward the next one
    const start = level ? LEVELS[level - 1].goal : 0;
    const t = Math.min(1, Math.max(0, (score - start) / (lv().goal - start)));
    text(`LEVEL ${level + 1}`, W / 2, 17, 13, '#fff', 'center', 800);
    roundRect(W / 2 - 55, 29, 110, 8, 4);
    ctx.fillStyle = 'rgba(0,0,0,.3)';
    ctx.fill();
    if (t > 0) {
      roundRect(W / 2 - 55, 29, Math.max(8, 110 * t), 8, 4);
      ctx.fillStyle = '#ffe46b';
      ctx.fill();
    }

    // active power-ups with a countdown ring
    if (!player) return;
    let x = 30;
    const active = [];
    if (player.shield) active.push(['shield', 1]);
    for (const k of ['magnet', 'boots', 'rocket', 'double']) {
      if (player[k] > 0) active.push([k, player[k] / POWERUPS[k].time]);
    }
    for (const [k, frac] of active) {
      drawPowerIcon(k, x, 68, 13);
      if (k !== 'shield') {
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.arc(x, 68, 18, -Math.PI / 2, -Math.PI / 2 + frac * Math.PI * 2);
        ctx.stroke();
      }
      x += 42;
    }
  }

  function drawMuteBtn() {
    const { x, y, size } = MUTE_BTN;
    ctx.save();
    roundRect(x, y, size, size, 8);
    ctx.fillStyle = 'rgba(0,0,0,.25)';
    ctx.fill();
    ctx.translate(x + 7, y + 9);
    ctx.fillStyle = '#fff';
    ctx.beginPath();               // speaker body
    ctx.moveTo(0, 5); ctx.lineTo(5, 5); ctx.lineTo(10, 0);
    ctx.lineTo(10, 14); ctx.lineTo(5, 9); ctx.lineTo(0, 9);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.beginPath();
    if (muted) {                   // X
      ctx.moveTo(13, 4); ctx.lineTo(19, 10);
      ctx.moveTo(19, 4); ctx.lineTo(13, 10);
    } else {                       // sound waves
      ctx.arc(11, 7, 4, -Math.PI / 3, Math.PI / 3);
      ctx.moveTo(11 + 8 * Math.cos(-Math.PI / 3), 7 + 8 * Math.sin(-Math.PI / 3));
      ctx.arc(11, 7, 8, -Math.PI / 3, Math.PI / 3);
    }
    ctx.stroke();
    ctx.restore();
  }

  function drawArrow(r, dir) {
    roundRect(r.x, r.y, r.w, r.h, 12);
    ctx.fillStyle = 'rgba(255,255,255,.15)';
    ctx.fill();
    const cx = r.x + r.w / 2, cy = r.y + r.h / 2;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.moveTo(cx + dir * 8, cy);
    ctx.lineTo(cx - dir * 6, cy - 10);
    ctx.lineTo(cx - dir * 6, cy + 10);
    ctx.closePath();
    ctx.fill();
  }

  function overlay() {
    ctx.fillStyle = 'rgba(10,12,35,.55)';
    ctx.fillRect(0, 0, W, H);
  }

  let menuT = 0;
  function drawMenu() {
    menuT += 0.05;
    overlay();
    text('SKY', W / 2, 150, 58, '#ffb347');
    text('JUMPER', W / 2, 205, 58, '#fff');
    // bigger preview of the selected jumper, bouncing on a platform
    const bounce = Math.abs(Math.sin(menuT * 1.4)) * 30;
    ctx.save();
    ctx.translate(W / 2, 372);
    ctx.scale(1.6, 1.6);
    ctx.translate(-W / 2, -372);
    drawPlayerAt(W / 2 - 20, 332 - bounce, 1, bounce < 3 ? 1 - bounce / 3 : 0, Math.cos(menuT * 1.4) * -10);
    ctx.restore();
    ctx.fillStyle = '#5fd068';
    roundRect(W / 2 - 35, 372, 70, 12, 6); ctx.fill();

    // character picker
    drawArrow(ARROW_L, -1);
    drawArrow(ARROW_R, 1);
    text(CHARACTERS[charIndex].name, W / 2, 404, 20, '#fff');
    for (let i = 0; i < CHARACTERS.length; i++) {
      ctx.fillStyle = i === charIndex ? '#ffe46b' : 'rgba(255,255,255,.3)';
      ctx.beginPath();
      ctx.arc(W / 2 + (i - (CHARACTERS.length - 1) / 2) * 14, 426, 4, 0, Math.PI * 2);
      ctx.fill();
    }

    text('← → or tap the arrows to pick a jumper', W / 2, 455, 14, 'rgba(255,255,255,.9)', 'center', 600);
    text('In game: ← → / A D, or hold left / right side', W / 2, 477, 13, 'rgba(255,255,255,.7)', 'center', 500);
    text('M to mute · 3 levels · dodge obstacles · grab power-ups', W / 2, 497, 12, 'rgba(255,255,255,.6)', 'center', 500);
    const pulse = 0.6 + Math.sin(menuT * 3) * 0.4;
    text('Press SPACE or tap to start', W / 2, 530, 19, `rgba(255,228,107,${pulse})`, 'center', 700);
    if (best) text('Best: ' + best, W / 2, 580, 16, 'rgba(255,255,255,.7)', 'center', 600);
  }

  function drawGameOver() {
    overlay();
    text('GAME OVER', W / 2, 170, 46, '#ff6b6b');
    text(DEATH_TEXT[deathCause], W / 2, 215, 18, 'rgba(255,255,255,.85)', 'center', 600);
    text(`Reached level ${level + 1}: ${LEVELS[level].name}`, W / 2, 245, 15, 'rgba(255,255,255,.65)', 'center', 600);
    text('Score', W / 2, 290, 18, 'rgba(255,255,255,.7)', 'center', 600);
    text(score.toString(), W / 2, 330, 52, '#fff');
    const isBest = score >= best && score > 0;
    text(isBest ? '★ New best! ★' : 'Best: ' + best, W / 2, 385, 20, isBest ? '#ffe46b' : 'rgba(255,255,255,.75)', 'center', 700);
    drawEndButtons('retry');
  }

  function drawWin() {
    overlay();
    menuT += 0.05;
    for (let i = 0; i < 5; i++) {
      const a = menuT + i * 1.26;
      ctx.fillStyle = '#ffe46b';
      ctx.globalAlpha = 0.6 + Math.sin(menuT * 3 + i) * 0.4;
      ctx.beginPath();
      ctx.arc(W / 2 + Math.cos(a) * 150, 175 + Math.sin(a) * 40, 3, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    text('YOU WIN!', W / 2, 160, 52, '#ffe46b');
    text('All 3 levels cleared 🎉', W / 2, 210, 18, '#fff', 'center', 700);
    drawPlayerAt(W / 2 - 20, 235 + Math.sin(menuT * 3) * 4, 1, 0, -2);
    text('Score', W / 2, 310, 18, 'rgba(255,255,255,.7)', 'center', 600);
    text(score.toString(), W / 2, 350, 52, '#fff');
    const isBest = score >= best && score > 0;
    text(isBest ? '★ New best! ★' : 'Best: ' + best, W / 2, 400, 20, isBest ? '#ffe46b' : 'rgba(255,255,255,.75)', 'center', 700);
    drawEndButtons('play again');
  }

  function drawEndButtons(verb) {
    menuT += 0.05;
    const pulse = 0.6 + Math.sin(menuT * 3) * 0.4;
    text(`Press SPACE or tap to ${verb}`, W / 2, 470, 19, `rgba(255,228,107,${pulse})`, 'center', 700);
    roundRect(CHANGE_BTN.x, CHANGE_BTN.y, CHANGE_BTN.w, CHANGE_BTN.h, 12);
    ctx.fillStyle = 'rgba(255,255,255,.15)';
    ctx.fill();
    text('Change jumper (C)', W / 2, CHANGE_BTN.y + CHANGE_BTN.h / 2, 16, '#fff', 'center', 700);
  }

  function drawBanner() {
    if (banner.t <= 0) return;
    const L = LEVELS[banner.level];
    const a = Math.min(1, banner.t / 30, (170 - banner.t) / 15 + 0.2);
    ctx.save();
    ctx.globalAlpha = Math.max(0, a);
    ctx.fillStyle = 'rgba(10,12,35,.45)';
    ctx.fillRect(0, H * 0.3 - 50, W, 100);
    text(`LEVEL ${banner.level + 1}`, W / 2, H * 0.3 - 14, 40, '#ffe46b');
    text(L.name, W / 2, H * 0.3 + 26, 20, '#fff', 'center', 700);
    ctx.restore();
  }

  function drawToasts() {
    if (!toasts.length) return;
    const t = toasts[0];
    const a = Math.min(1, t.t / 20, (150 - t.t) / 10);
    ctx.save();
    ctx.globalAlpha = Math.max(0, a);
    ctx.font = '700 15px system-ui, -apple-system, "Segoe UI", sans-serif';
    const w = Math.min(W - 24, ctx.measureText(t.text).width + 32);
    roundRect(W / 2 - w / 2, H - 100, w, 34, 17);
    ctx.fillStyle = 'rgba(10,12,35,.75)';
    ctx.fill();
    ctx.strokeStyle = t.color;
    ctx.lineWidth = 2;
    ctx.stroke();
    text(t.text, W / 2, H - 83, 15, '#fff', 'center', 700);
    ctx.restore();
  }

  function draw() {
    ctx.save();
    if (shake > 0) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
      shake *= 0.88;
      if (shake < 0.5) shake = 0;
    }
    drawBackground();
    if (state === 'menu') {
      drawMenu();
    } else {
      for (const p of platforms) drawPlatform(p);
      for (const s of stars) drawStar(s);
      for (const o of obstacles) drawObstacle(o);
      drawParticles();
      if (state === 'playing' || state === 'paused') drawPlayer();
      if (flash > 0.02) {
        ctx.fillStyle = `rgba(255,255,255,${flash * 0.5})`;
        ctx.fillRect(0, 0, W, H);
      }
      drawHUD();
      if (state === 'playing') { drawBanner(); drawToasts(); }
      if (state === 'over') drawGameOver();
      if (state === 'won') drawWin();
      if (state === 'paused') {
        overlay();
        text('PAUSED', W / 2, H / 2 - 10, 42);
        text('Press P or tap to resume', W / 2, H / 2 + 35, 16, 'rgba(255,255,255,.75)', 'center', 600);
      }
    }
    drawMuteBtn();
    ctx.restore();
  }

  // ---------- Loop (fixed 60Hz timestep) ----------
  const STEP = 1000 / 60;
  let last = performance.now(), acc = 0;
  function frame(now) {
    acc += Math.min(now - last, 250);
    last = now;
    while (acc >= STEP) { update(); acc -= STEP; }
    draw();
    requestAnimationFrame(frame);
  }

  reset();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
